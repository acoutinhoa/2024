{% extends 'consultorio/base.html' %}

{% block header %}
<!-- nome do paciente com link para home -->
<div id="nome" hx-post="{% url 'consultorio:index' %}" hx-target="#body" hx-trigger="click" hx-push-url="true">
    <!-- {% include 'consultorio/paciente_nome.html' %}    -->
    {{ paciente.nome }}
</div>

<!-- menu paciente -->
<div id="menu_paciente"></div>
{% endblock %}

{% block content %}
<div id="content" hx-get="{% url 'consultorio:paciente-dados' paciente.pk %}" hx-target=this hx-trigger="load" hx-swap="outerHTML" >
</div>
{% endblock %}
