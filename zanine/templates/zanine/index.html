{% extends 'zanine/base.html' %}

{% load zanine.my_tags %}

{% block content %}
<div class="header">
    <h1 style="float: left; margin-right: 40px;">zanine timeline</h1>
    {% for t in tipos %}
    <a href="{% url 'zanine:tl' tipo=t %}"><div class="bt {% if t == tipo %}active{% endif %}">{{ t }}</div></a>
    {% endfor %}
</div>

<!-- p5js -->
<script>
let tl0={{ variaveis.inicio }};
let tl1={{ variaveis.fim }};
let m={{ variaveis.largura }};
let mh={{ variaveis.altura }};
let mtop=3*mh;
let fs={{ variaveis.text_size }};
let w_cidades=fs*20;
let x;
let x2;
let xt;
let c;
let eixoy=[];
let linear
// pagina
let pw=(tl1-tl0+1)*m+w_cidades;
let ph=({{ eventos|length }}+{{ lh }}/2)*mh + mtop + 2*mh;


function setup() {
    createCanvas(pw, ph);
    angleMode(DEGREES);
    textFont('{{ variaveis.fonte }}');
    textSize(fs);

    // botao pra salvar
    let button = createButton(' save png ');
    button.class('bt save')
    button.position(500, 32);
    button.mousePressed(salvar_png);

    let button2 = createButton(' save jpg ');
    button2.class('bt save')
    button2.position(575, 32);
    button2.mousePressed(salvar_jpg);

    
    let linha=color(230,230,230);
    let y=0;

    // // legenda tentativa de funcao

    let tp = '{{ tipo }}';
    let eventos_qs = {{ eventos|queryset_as_json }};
    let legenda_qs = {{ legenda|queryset_as_json }};
    let cores_qs = {{ cores|queryset_as_json }};
    let cidades_qs = {{ cidades|queryset_as_json }};
    let tags_qs = {{ tags|queryset_as_json }};

    let linear = false;

    let c0;
    let t0;
    for (e in eventos_qs) {
        let evento = eventos_qs[e];
        let cidade = cidades_qs[evento.fields.cidade-1];
        let tag = tags_qs[evento.fields.tag-1];

        // texto
        let mudou=false;
        let txt;
        if (tp=='cidades') {
            if (cidade != c0) {
                mudou = true;
                if (cidade) {
                    txt= `${cidade.fields.cidade} [${cidade.fields.pais}]`;
                }
                // console.log( '>>>>>>>>>>> mudou ==>', txt );
                c0 = cidade;
            }
            // console.log('cidades', e, evento.fields.inicio, cidade, );
        }   else if (tp=='tags') {
            if (tag != t0) {
                mudou = true;
                if (tag) {
                    txt= tag.fields.nome;
                }
                console.log( '>>>>>>>>>>> mudou ==>', txt );
                t0 = tag;
            }
            // console.log('tags', e, evento.fields.inicio, tag, );
        }

        // posicao
        x=posicao(evento.fields.inicio);

        if (mudou) {
            eixoy.push( [y,txt] );

            if (linear) {
                y+=mh/2;
            }

            if (txt) {
                if (linear) {
                    textStyle(BOLD);
                    textAlign(RIGHT);
                    text(txt,x-fs,y+fs);
                } else {
                    textAlign(RIGHT);
                    textStyle(NORMAL);
                    text(txt,-fs/2,y+mh/2);
                    // linha
                    push();
                    stroke(linha);
                    line(-w_cidades,y,width,y);
                    pop();
                }
            }
        }  

        // altura
        let h;
        if (linear) {
            h=mh/2
        } else {
            h=mh
        }

        // cor
        let cor;
        if ((tp=='cidades') && (cidade)) {
            cor = cidade.fields.cor
        }   else if ((tp=='tags') && (tag)) {
            cor = tag.fields.cor
        }
        console.log(cor);


    
        console.log(tp, e, evento.fields.inicio, x);


    }

function draw() {
    background(255);
    noStroke();

    let linha=color(230,230,230);
    let y=0;

    // // fundo cinza
    // push()
    // fill(linha);
    // rect(0,0,w_cidades,height);
    // rect(0,0,width,mtop+({{ lh }}/2)*mh);
    // pop()

    // tempo
    for (let i=0; i<(tl1-tl0+1); i++){
        let x=i*m;
        let t=tl0+i;
        push();
        translate(x+w_cidades,0);
        stroke(linha);
        if (((m<30) && (t%5==0)) || (m>=30) || (i==0)) {line(0,0,0,height);}
        rotate(-90);
        noStroke();
        textSize({{ variaveis.data_size }});
        if (t%5==0) {textStyle(BOLD);}
        else {textStyle(NORMAL);}
        text(t, -1.5*mh, 8+m/10);
        pop();
    }

    push();
    noStroke();
    fill(0);
    
    translate(w_cidades,0);
    y+=mtop-mh;


    // legenda
    {% for evento in legenda %}

        // cidade ou tag
        {% set False as mudou %}
        {% if tipo == 'cidades' %}
            {% ifchanged evento.tag %}
                {% set True as mudou %}
                {% set evento.tag as txt %}

                {% set evento.tag.cor.rgb as cor %}

            {% endifchanged %}
        {% elif tipo == 'tags' %}
            {% ifchanged evento.cidade %}
                {% set True as mudou %}
                {% set evento.cidade as txt %}

                {% set evento.cidade.cor.rgb as cor %}

            {% endifchanged %}
        {% endif %}

        // posicao
        x=posicao( '{{ evento.inicio }}' );       

        {% if mudou %}
            y+=mh/2;
            {% if txt %}
                textStyle(BOLD);
                textAlign(RIGHT);
                text('{{ txt }}',x-fs,y+fs);
                // text('{{ txt }}',-fs/2,y+fs);
                // stroke(linha);
                // line(-w_cidades,y,width,y);
            {% endif %}
            eixoy.push( [y,'{{ txt }}'] );
        {% endif %}

        push();
        if ('{{ cor }}') {
            c = defCor('{{ cor }}');
            fill(c);
            noStroke();
        }
        else {
            stroke(0);
            noFill();
        }

        {% if evento.fim %}
            x2=posicao( '{{ evento.fim }}' );
            rect(x,y,x2-x,mh/2);
        {% else %}
            ellipse(x,y+mh/4,mh/2,mh/2);
        {% endif %}
        pop();

    {% endfor %}
    y+=mh;

    // timeline
    {% for evento in eventos %}

        // cidade ou tag
        {% set False as mudou %}
        {% if tipo == 'cidades' %}
            {% ifchanged evento.cidade %}
                {% set evento.cidade as txt %}
                {% set True as mudou %}
            {% endifchanged %}
        {% elif tipo == 'tags' %}
            {% ifchanged evento.tag %}
                {% set evento.tag as txt %}
                {% set True as mudou %}
            {% endifchanged %}
        {% endif %}

        // timeline eixo y
        {% if mudou %}
            {% if txt %}
                textAlign(RIGHT);
                textStyle(NORMAL)
                fill(0);
                text('{{ txt }}',-fs/2,y+mh/2);
            {% endif %}
            eixoy.push( [y,'{{ txt }}'] );
            push();
            stroke(linha);
            line(-w_cidades,y,width,y);
            pop();
        {% endif %}

        // cor
        {% if tipo == 'tags' %}
            {% set evento.cidade.cor.rgb as cor %}
        {% elif tipo == 'cidades' %}
            {% set evento.tag.cor.rgb as cor %}
        {% endif %}
        push();
        if ('{{ cor }}') {
            c = defCor('{{ cor }}');
            fill(c);
            noStroke();
        }
        else {
            stroke(0);
            noFill();
        }
        // posicao
        x=posicao( '{{ evento.inicio }}' );
        {% if evento.fim %}
            x2=posicao( '{{ evento.fim }}' );
            rect(x,y,x2-x,mh);
            xt=x2+mh/3;
        {% else %}
            ellipse(x,y+mh/2,mh/2,mh/2);
            xt=x+mh/2;
        {% endif %}
        pop();
        textAlign(LEFT);
        textStyle(BOLD);
        text('{{ evento.info_pt|linebreaksbr|nobreaks }}',xt,y+mh/2-2);
        textStyle(ITALIC);
        text('{{ evento.info_fr|linebreaksbr|nobreaks }}',xt,y+mh-5);
        y+=mh;
    {% endfor %}

    pop();



    // mouse
    cursor(CROSS); // Draw cursor as cross
    if (mouseIsPressed == true) {
        push();
        let px=Math.trunc( (mouseX-w_cidades)/m )+tl0;
        let pxw=textWidth(px);
        let py='';
        for (let i=0; i<eixoy.length; i++){
            if (mouseY > eixoy[i][0]) {
                if ((i === eixoy.length - 1) || (mouseY < eixoy[i+1][0])) {
                    py=eixoy[i][1];
                    break;
                }
            }
        }
        let pyw=textWidth(py);
        fill(0);
        rect(mouseX,mouseY-2,pxw+4,-fs);
        fill(255);
        text(px,mouseX+2,mouseY-4); 
        if (py != 'None') {
            fill(0);
            rect(mouseX,mouseY-2,pyw+4,+fs);
            fill(255);
            text(py,mouseX+2,mouseY+fs-4); 
        }
        pop();
    }
}


function defCor(cor) {
    let c;
    cor=cor.split(' ');
    if (cor.length == 1){ c=color(cor[0],cor[0],cor[0]); }
    else if (cor.length == 3){ c=color(cor[0], cor[1], cor[2]); }
    else if (cor.length == 4){ c=color(cor[0], cor[1], cor[2], cor[3]); }
    return c;
}

function posicao(data) {
    let mm=m/13;
    let md=mm/31;
    data=data.split('/');
    ano=data[0];
    mes=data[1];
    dia=data[2];
    return (ano-tl0)*m + mes*mm + dia*md;
}

function salvar_png() {
    saveCanvas('zanine_tl', 'png');
}

function salvar_jpg() {
    saveCanvas('zanine_tl_'+'{{ tipo }}', 'jpg');
}

function setLineDash(list) {
    drawingContext.setLineDash(list);
}

</script>
{% endblock %}
